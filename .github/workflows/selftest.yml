# Release hygiene, lint and the six offline self-tests on CPU, at both ends of the supported Python range.
name: self-tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: Python ${{ matrix.python-version }} / torch 2.14.1 CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install PyTorch (CPU wheel)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1

      - name: Install the remaining pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Show versions
        run: |
          python --version
          python -c "import torch; print('torch', torch.__version__)"
          ruff --version

      - name: Release checks, lint and self-tests
        run: python scripts/check_release.py --run-tests
